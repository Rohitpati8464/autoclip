name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Python versions on Linux; one on macOS and Windows.
        # The Windows leg is not optional — filtergraph path escaping and
        # keyring behaviour both differ there, and both have already caused bugs.
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
          - { os: windows-latest, python: '3.12' }

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - name: Verify ffmpeg has libass
        shell: bash
        run: |
          ffmpeg -hide_banner -version | grep -q libass \
            || { echo "::error::This ffmpeg build lacks libass; captions cannot be burned in."; exit 1; }

      - name: Create the environment
        run: uv venv --python ${{ matrix.python }}

      - name: Put the environment on PATH
        # Tools are run from this venv rather than through `uv run`, which syncs
        # the whole project including optional extras — that would pull PyTorch
        # on every lint job, and turns any extra's resolution problem into a
        # failure of every step.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Check that every extra resolves
        # Catches an unsatisfiable extra without paying to download it. The
        # diarization extra shipped broken once because of a numpy upper bound.
        run: |
          uv pip install --dry-run -e ".[diarization]"
          uv pip install --dry-run -e ".[gpu]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy backend/autoclip
        continue-on-error: true

      - name: Unit tests
        run: pytest -m "not slow and not golden and not e2e" -q

      - name: Render tests
        # The real ffmpeg render path — the one that catches escaping, font, and
        # encoder problems that unit tests structurally cannot.
        run: pytest -m "slow and not golden and not e2e" -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          push: false
          load: true
          tags: autoclip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name autoclip -p 8000:8000 autoclip:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "\nHealthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy."
          docker logs autoclip
          exit 1
